   async function exportReportsToExcel() {
  const { data, error } = await supabaseClient
    .from("reports")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    alert("제보 내역을 불러오지 못했습니다.");
    return;
  }

  const department = document.getElementById("departmentFilter")?.value || "전체";
  const status = document.getElementById("statusFilter")?.value || "전체";
  const normalize = value => String(value || "").replace(/['"]/g, "").trim();

  const filtered = (data || []).filter(r => {
    const departmentMatch = department.includes("전체") ||
      (department === "미분류" ? !normalize(r.department) || normalize(r.department) === "미분류" : normalize(r.department) === department);
    const statusMatch = status.includes("전체") || normalize(r.status || "접수") === status;
    return departmentMatch && statusMatch;
  });

  if (!filtered.length) {
    alert("저장할 제보가 없습니다.");
    return;
  }

  const columns = ["접수일", "제목", "내용", "담당부서", "처리상태", "처리결과"];
  const fields = r => [
    r.created_at ? new Date(r.created_at).toLocaleString("ko-KR") : "",
    r.title || "",
    r.content || "",
    normalize(r.department) || "미분류",
    normalize(r.status) || "접수",
    r.resolution_content || ""
  ];
  const csv = [columns, ...filtered.map(fields)]
    .map(row => row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(","))
    .join("\r\n");

  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "강동_주민제보_" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}
    async function loadReports() {
  const { data, error } = await supabaseClient
    .from("reports")
    .select("*")
    .order("created_at", { ascending: false });
      if (error) {
  console.error("제보 불러오기 오류:", error);
  return;
}
      
const stats = document.getElementById("reportStats");
const statsContent = document.getElementById("reportStatsContent");

const total = data.length;

const received = data.filter(r => (r.status || "접수").replace(/['‘’]/g, "").trim() === "접수").length;

const processing = data.filter(r => r.status === "처리 중").length;
const completed = data.filter(r => r.status === "해결 완료").length;

statsContent.textContent =
  `전체 ${total}건 | 접수 ${received}건 | 처리 중 ${processing}건 | 해결 완료 ${completed}건`;

stats.style.display = "block";

      const reportList = document.getElementById("reportList");
reportList.style.display = "none";
     const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;",
  '"': "&quot;", "'": "&#39;"
}[ch]));


const selectedDepartment = document.getElementById("departmentFilter")?.value || "전체";
const filteredData = selectedDepartment === "전체"
  ? data
  : data.filter(report =>
      (report.department || "미분류") === selectedDepartment
    );

      const selectedStatus = document.getElementById("statusFilter")?.value || "전체";

  ? filteredData
  : filteredData.filter(report => (report.status || "접수") === selectedStatus);
      const items = (await Promise.all(statusFilteredData.map(async report => {
  let photoHtml = "";

  if (report.photo_path) {
    const { data: photo, error: photoError } = await supabaseClient.storage
      .from("report-photos")
      .createSignedUrl(report.photo_path, 300);

    if (!photoError && photo?.signedUrl) {
      photoHtml = `<p><img src="${escapeHtml(photo.signedUrl)}" alt="제보 사진" style="max-width:100%;max-height:300px;border-radius:8px;"></p>`;
    }
  }

  return `
   <details class="report-item" style="background:white; padding:15px; margin-bottom:12px; border-radius:12px;">
     <summary style="cursor:pointer; font-size:18px; font-weight:bold; padding:10px 0;">
  ${escapeHtml(report.title || "제목 없음")}
  <span style="font-size:13px; color:#777; margin-left:10px;">
    [${escapeHtml(report.status || "접수")}]
  </span>
</summary>
     <p><strong>제보번호:</strong> ${report.id}</p>
      <p><strong>제보내용:</strong> ${escapeHtml(report.content || "-")}</p>
     
<p><strong>담당부서:</strong></p>
<select id="department-${report.id}" style="display:block;width:220px;height:40px;margin-bottom:12px;">
  ${["미분류","도로·교통","환경·청소","공원·녹지","복지","안전·시설","기타"].map(dept =>
    `<option value="${dept}" ${report.department === dept ? "selected" : ""}>${dept}</option>`
  ).join("")}
</select>

<button type="button"
  onclick="saveDepartment(${report.id})"
  style="padding:10px 16px;margin-bottom:15px;">
  담당부서 저장
</button>

      <p><strong>처리상태:</strong> ${escapeHtml(report.status || "접수")}</p>
      <select class="status-select" style="display:block; width:200px; height:40px; margin:10px 0; border:2px solid #333; background:white; color:black;" data-report-id="${report.id}" onchange="updateReportStatus(this.dataset.reportId, this.value)">
  <option value="접수" ${report.status === "접수" ? "selected" : ""}>접수</option>
  <option value="처리 중" ${report.status === "처리 중" ? "selected" : ""}>처리 중</option>
  <option value="해결 완료" ${report.status === "해결 완료" ? "selected" : ""}>해결 완료</option>
</select>
<p><strong>해결 결과:</strong></p>
<textarea
  id="resolution-${report.id}"
  rows="3"
  placeholder="주민에게 공개할 해결 내용을 입력하세요."
  style="width:100%;padding:10px;box-sizing:border-box;"
>${escapeHtml(report.resolution_content || '')}</textarea>
<div style="display:flex; flex-wrap:wrap; align-items:center;">
<button
  type="button"
  onclick="saveResolution(${report.id})"
  style="margin:8px 0;padding:10px 16px;background:#e94b8b;color:white;border:0;border-radius:8px;cursor:pointer;">

<button

  style="margin:8px 0;padding:10px 16px;background:#f59e0b;color:white;border:0;border-radius:8px;cursor:pointer;">
  🏅 스탬프 지급
</button>
</div>
      ${photoHtml}
    </details>
  `;
}))).join("");
      reportList.innerHTML = `<h2>📋 접수된 주민제보 목록</h2>${items}`;
    }
    async function updateReportStatus(id, status) {
  const { error } = await supabaseClient
    .from("reports")
    .update({ status: status })
    .eq("id", id);

  if (error) {
    alert("처리상태 저장에 실패했습니다.");
    console.error(error);
    return;
  }

  alert("처리상태가 저장되었습니다.");
}
  async function awardStamp(reportId) {
  const { data: report, error: reportError } = await supabaseClient
    .from("reports")
    .select("id, user_id, status")
    .eq("id", reportId)
    .single();

  if (reportError || !report) {
    alert("제보 정보를 확인할 수 없습니다.");
    return;
  }

  if (report.status !== "해결 완료") {
    alert("해결 완료된 제보에만 스탬프를 지급할 수 있습니다.");
    return;
  }

  if (!report.user_id) {
    alert("회원 정보가 연결되지 않은 제보입니다.");
    return;
  }

  if (!confirm("이 제보에 스탬프 1개를 지급하시겠습니까?")) {
    return;
  }

  const { error } = await supabaseClient
    .from("incentive_stamps")
    .insert({
      report_id: report.id,
      user_id: report.user_id
    });

  if (error) {
    if (error.code === "23505") {
      alert("이미 스탬프가 지급된 제보입니다.");
    } else {
      alert("스탬프 지급에 실패했습니다.");
      console.error(error);
    }
    return;
  }

  alert("스탬프 1개가 지급되었습니다.");
}
async function saveDepartment(id) {
  const department = document.getElementById(`department-${id}`).value;

  const { error } = await supabaseClient
    .from("reports")
    .update({ department: department })
    .eq("id", id);

  if (error) {
    alert("담당부서 저장에 실패했습니다.");
    console.error(error);
    return;
  }

  alert("담당부서가 저장되었습니다.");
}

    async function saveResolution(id) {
  const content = document.getElementById(`resolution-${id}`).value.trim();

  const { error } = await supabaseClient
    .from("reports")
    .update({ resolution_content: content })
    .eq("id", id);

  if (error) {
    alert("해결 내용 저장에 실패했습니다.");
    console.error(error);
    return;
  }

  alert("해결 내용이 저장되었습니다.");
}  
  async function publishResolution(id) {
  const { data: report, error: readError } = await supabaseClient
    .from("reports")
    .select("id, title, location, status, resolution_content")
    .eq("id", id)
    .single();

  if (readError || !report) {
    alert("제보 정보를 확인하지 못했습니다.");
    return;
  }

  if (report.status !== "해결 완료") {
    alert("처리상태를 먼저 '해결 완료'로 변경해 주세요.");
    return;
  }

  const content = (report.resolution_content || "").trim();

  if (!content) {
    alert("해결 내용을 먼저 작성하고 저장해 주세요.");
    return;
  }

  if (!confirm("이 해결 사례를 주민 홈페이지에 공개하시겠습니까?")) {
    return;
  }

  const { error } = await supabaseClient
    .from("resolved_news")
    .upsert({
      report_id: report.id,
      title: report.title,
      location: report.location,
      resolution_content: content
    }, { onConflict: "report_id" });

  if (error) {
    console.error(error);
    alert("공개에 실패했습니다.");
    return;
  }

  alert("주민 홈페이지에 공개되었습니다.");
}  

async function saveNotice() {
  const title = document.getElementById("noticeTitle").value.trim();
  const content = document.getElementById("noticeContent").value.trim();
  const message = document.getElementById("noticeMessage");

  if (!title || !content) {
    message.textContent = "제목과 내용을 모두 입력해 주세요.";
    return;
  }

  const { data: { user }, error: authError } =
    await supabaseClient.auth.getUser();

  if (authError || !user) {
    message.textContent = "관리자 로그인이 필요합니다.";
    return;
  }

  const { error } = await supabaseClient
    .from("notices")
    .insert({
      title: title,
      content: content
    });

  if (error) {
    console.error(error);
    message.textContent = "등록 실패: " + error.message;
    return;
  }

  message.textContent = "공지사항이 등록되었습니다.";
  document.getElementById("noticeTitle").value = "";
  document.getElementById("noticeContent").value = "";
}

  </script>

function showAdminSection(section) {
  const reports = document.getElementById("reportList");

const community = document.getElementById("communityAdmin");
community.style.display = section === "community" ? "block" : "none";

document.getElementById("departmentFilterBox").style.display =
  section === "reports" ? "block" : "none";

document.getElementById("statusFilterBox").style.display =
  section === "reports" ? "block" : "none";

document.getElementById("exportReportsButton").style.display =
  section === "reports" ? "block" : "none";
  if (section === "reports") {
    reports.style.display = "block";
    notices.style.display = "none";
  } else if (section === "notices") {
    reports.style.display = "none";
    notices.style.display = "block";
  } else if (section === "community") {
    reports.style.display = "none";
    notices.style.display = "none";

  }
}
</script>
