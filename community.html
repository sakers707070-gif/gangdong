
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 서로 소통해요</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8fb;
      margin: 0;
      padding: 24px;
      color: #172033;
    }
    main {
      max-width: 480px;
      margin: auto;
    }
    h1 { color: #e94b8b; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 2px 10px #00000010;
    }
  </style>
</head>
<body>
  <main>
    <a href="index.html">← 주민 홈페이지로 돌아가기</a>
    <h1>💬 우리 서로 소통해요</h1>
    <p>주민 여러분의 이야기를 자유롭게 나눠주세요.</p>
    <div class="card">
      <h2>주민 소통 게시판</h2>
      <p>우리 동네 이야기와 좋은 의견을 함께 나누는 공간입니다.</p>
     
<h3>✏️ 주민 이야기 작성하기</h3>
<input type="text" id="postTitle"
  placeholder="제목을 입력하세요"
  style="width:100%;box-sizing:border-box;padding:12px;margin-bottom:10px;">

<textarea id="postContent"
  placeholder="우리 동네 이야기를 자유롭게 작성해 주세요."
  rows="6"
  style="width:100%;box-sizing:border-box;padding:12px;"></textarea>

<button type="button" onclick="submitPost()"
  style="margin-top:12px;padding:12px 20px;background:#e94b8b;color:white;border:0;border-radius:8px;">
  글 등록하기
</button>

    </div>
  </main>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
 const SUPABASE_URL = "https://ocdcolatdqdhbtlaczqu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_lAayL_opCjkcmH9NA06fzw_EoCITwdm";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  
async function submitPost() {
  const title = document.getElementById('postTitle').value.trim();
  const content = document.getElementById('postContent').value.trim();

  if (!title || !content) {
    alert('제목과 내용을 모두 입력해 주세요.');
    return;
  }

  if (title.length > 100 || content.length > 5000) {
    alert('제목은 100자, 내용은 5000자 이내로 작성해 주세요.');
    return;
  }

  const { error } = await db
    .from('community_posts')
    .insert({
      title: title,
      content: content,
      author_name: '강동구 주민',
      is_visible: false
    });

  if (error) {
    alert('등록 중 오류가 발생했습니다. 다시 시도해 주세요.');
    console.error(error);
    
alert('상세 오류: ' + error.message);

    return;
  }

  alert('글이 접수되었습니다. 관리자 승인 후 공개됩니다.');
  document.getElementById('postTitle').value = '';
  document.getElementById('postContent').value = '';
}


async function loadApprovedPosts() {
  const { data, error } = await db
    .from('community_posts')
    .select('title, content, author_name, created_at')
    .eq('is_visible', true)
    .order('created_at', { ascending: false });

  let area = document.getElementById('approvedPosts');

  if (!area) {
    area = document.createElement('div');
    area.id = 'approvedPosts';
    area.style.marginTop = '30px';
    document.querySelector('main').appendChild(area);
  }

  area.replaceChildren();

  const heading = document.createElement('h2');
  heading.textContent = '주민들이 나눈 이야기';
  area.appendChild(heading);

  if (error) {
    const message = document.createElement('p');
    message.textContent = '게시글을 불러오지 못했습니다.';
    area.appendChild(message);
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    const message = document.createElement('p');
    message.textContent = '아직 공개된 게시글이 없습니다.';
    area.appendChild(message);
    return;
  }

  data.forEach(post => {
    const card = document.createElement('div');
    card.style.cssText =
      'background:white;padding:16px;margin:12px 0;border-radius:12px;';

    const title = document.createElement('h3');
    title.textContent = post.title;

    const content = document.createElement('p');
    content.textContent = post.content;
    content.style.whiteSpace = 'pre-wrap';

    card.append(title, content);
    const commentInput = document.createElement('textarea');
commentInput.placeholder = '댓글을 입력해 주세요';
commentInput.maxLength = 1000;
commentInput.style.cssText = 'width:100%;box-sizing:border-box;margin-top:12px;padding:10px;border:1px solid #ddd;border-radius:8px;';
card.appendChild(commentInput);
    const commentButton = document.createElement('button');
commentButton.textContent = '댓글 등록하기';
commentButton.style.cssText = 'background:#e75480;color:white;border:0;border-radius:8px;padding:10px 16px;margin-top:8px;cursor:pointer;';
card.appendChild(commentButton);
    commentButton.onclick = async () => {
  const comment = commentInput.value.trim();

  if (!comment) {
    alert('댓글 내용을 입력해 주세요.');
    return;
  }

  commentButton.disabled = true;

  const { error } = await db
    .from('community_comments')
    .insert({
      post_id: post.id,
      author_name: '강동구 주민',
      content: comment,
      is_visible: false
    });

  commentButton.disabled = false;

  if (error) {
    alert('댓글 등록에 실패했습니다.');
    console.error(error);
    return;
  }

  alert('댓글이 접수되었습니다. 관리자 승인 후 공개됩니다.');
  commentInput.value = '';
};
    area.appendChild(card);
  });
}

loadApprovedPosts();

</script>

</body>
</html>
