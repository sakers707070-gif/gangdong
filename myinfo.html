<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 정보 관리 - 강동웹앱</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 480px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
    }
    h2 { text-align: center; }
    .btn {
      display: block;
      padding: 14px;
      margin-top: 20px;
      background: #2456b8;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>내 정보 관리</h2>
    <p>회원정보를 확인하고 관리하는 공간입니다.</p>
    <div id="memberInfo">
  <p>회원정보를 불러올 준비가 되었습니다.</p>
</div>
    <a class="btn" href="index.html">홈으로 돌아가기</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
const SUPABASE_URL = "https://ocdcolatdqdhbtlaczqu.supabase.co";
const SUPABASE_KEY = "sb_publishable_lAayL_opCjkcmH9NA06fzw_EoCITwdm";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    async function loadMemberInfo() {
  const memberInfo = document.getElementById("memberInfo");

  const { data, error } = await supabaseClient.auth.getUser();

  if (error || !data.user) {
    memberInfo.textContent = "로그인 후 회원정보를 확인할 수 있습니다.";
    return;
  }

  const user = data.user;
  const name = user.user_metadata?.name || "등록되지 않음";
  const phone = user.user_metadata?.phone || "등록되지 않음";

  memberInfo.replaceChildren();

  const fields = [
    ["이름", name],
    ["휴대전화번호", phone],
    ["이메일", user.email || "등록되지 않음"]
  ];

  fields.forEach(([label, value]) => {
    const p = document.createElement("p");
    p.textContent = `${label}: ${value}`;
    memberInfo.appendChild(p);
  });
}

loadMemberInfo();
</script>
</body>
</html>
