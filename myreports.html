
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 제보 관리</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f7fb;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }
    header {
      background: #1766a4;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; font-size: 25px; }
    header p { margin: 0; font-size: 14px; }
    main { max-width: 720px; margin: 20px auto; padding: 0 14px; }
    .home {
      display: inline-block;
      margin-bottom: 16px;
      color: #1766a4;
      text-decoration: none;
      font-weight: bold;
    }
    .report {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000010;
    }
    .report h2 { margin: 0 0 10px; font-size: 19px; }
    .status { color: #1766a4; font-weight: bold; }
    label { display: block; margin: 12px 0 6px; font-weight: bold; }
    input, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }
    textarea { min-height: 100px; }
    button {
      background: #1766a4;
      color: white;
      border: none;
      border-radius: 7px;
      padding: 11px 18px;
      margin-top: 12px;
      cursor: pointer;
      font-size: 15px;
    }
    button:disabled { background: #aaa; }
    #message { line-height: 1.7; }
  </style>
</head>
<body>
  <header>
    <h1>나의 제보 관리</h1>
    <p>내가 접수한 제보를 확인하고 수정할 수 있습니다.</p>
  </header>

  <main>
    <a class="home" href="index.html">← 홈으로 돌아가기</a>
    <p id="message">로그인 정보를 확인하고 있습니다.</p>
    <div id="reportList"></div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://ocdcolatdqdhbtlaczqu.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_lAayL_opCjkcmH9NA06fzw_EoCITwdm";

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById("message");
    const reportList = document.getElementById("reportList");

    async function loadMyReports() {
      const { data: { user }, error: authError } =
        await client.auth.getUser();

      if (authError || !user) {
        message.textContent =
          "로그인 후 이용할 수 있습니다. 먼저 회원 로그인을 해주세요.";
        return;
      }

      const { data, error } = await client
        .from("reports")
        .select("id, title, content, status, created_at")
        .eq("user_id", user.id)
        .order("created_at", { ascending: false });

      if (error) {
        message.textContent =
          "제보 목록을 불러오지 못했습니다: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        message.textContent = "작성한 제보가 없습니다.";
        return;
      }

      message.textContent = "총 " + data.length + "건의 제보가 있습니다.";
      reportList.replaceChildren();

      data.forEach(report => {
        const card = document.createElement("div");
        card.className = "report";

        const heading = document.createElement("h2");
        heading.textContent = report.title || "제목 없음";

        const status = document.createElement("p");
        status.className = "status";
        status.textContent = "처리상태: " + (report.status || "접수");

        const titleLabel = document.createElement("label");
        titleLabel.textContent = "제보 제목";

        const titleInput = document.createElement("input");
        titleInput.value = report.title || "";

        const contentLabel = document.createElement("label");
        contentLabel.textContent = "제보 내용";

        const contentInput = document.createElement("textarea");
        contentInput.value = report.content || "";

        const saveButton = document.createElement("button");
        saveButton.textContent = "수정 내용 저장";

        // 접수 상태의 제보만 수정하도록 화면에서 제한합니다.
        const editable = (report.status || "").replace(/['"]/g, "").trim() === "접수";

        if (!editable) {
          titleInput.disabled = true;
          contentInput.disabled = true;
          saveButton.disabled = true;
          saveButton.textContent = "처리 중이거나 완료된 제보";
        }

        saveButton.addEventListener("click", async () => {
          const newTitle = titleInput.value.trim();
          const newContent = contentInput.value.trim();

          if (!newTitle || !newContent) {
            alert("제목과 내용을 모두 입력해주세요.");
            return;
          }

          saveButton.disabled = true;

          const { data: { user: currentUser } } =
            await client.auth.getUser();

          if (!currentUser) {
            alert("로그인이 필요합니다.");
            saveButton.disabled = false;
            return;
          }

          const { error } = await client
            .from("reports")
            .update({
              title: newTitle,
              content: newContent
            })
            .eq("id", report.id)
            .eq("user_id", currentUser.id)
            .eq("status", "접수");

          if (error) {
            alert("수정 실패: " + error.message);
          } else {
            alert("수정 요청을 처리했습니다. 목록을 다시 확인합니다.");
            await loadMyReports();
          }

          saveButton.disabled = false;
        });

        card.append(
          heading, status, titleLabel, titleInput,
          contentLabel, contentInput, saveButton
        );

        reportList.appendChild(card);
      });
    }

    loadMyReports();
  </script>
</body>
</html>
