
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강동엄마 박춘선 - 공지사항</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f7f8fb;
  font-family: Arial, "Noto Sans KR", sans-serif;
  color: #172033;
}
header {
  background: #ff4f9a;
  color: white;
  padding: 22px 16px;
  text-align: center;
}
header h1 { margin: 0; font-size: 24px; }
header p { margin: 8px 0 0; font-size: 14px; }
main {
  max-width: 480px;
  margin: auto;
  padding: 20px 15px 100px;
}
.notice {
  background: white;
  border-radius: 14px;
  margin-bottom: 12px;
  padding: 18px;
  box-shadow: 0 3px 12px #0000000d;
  cursor: pointer;
}
.notice h3 { margin: 0 0 8px; font-size: 17px; }
.date { font-size: 12px; color: #888; }
.detail {
  display: none;
  padding-top: 15px;
  line-height: 1.8;
  border-top: 1px solid #eee;
  margin-top: 15px;
}
.home {
  display: block;
  text-align: center;
  padding: 15px;
  background: #172d56;
  color: white;
  text-decoration: none;
  border-radius: 12px;
  margin-top: 25px;
}
</style>
</head>
<body>
<header>
  <h1>📢 공지사항</h1>
  <p>강동엄마 박춘선 시의원과 함께합니다</p>
</header>
<main>
  <div class="notice" onclick="toggleNotice(this)">
    <h3>공지사항 게시판에 오신 것을 환영합니다.</h3>
    <div class="date">안내</div>
    <div class="detail">
      이곳에서 강동구의 다양한 소식과
      의정활동 안내를 확인하실 수 있습니다.
    </div>
  </div>
<div id="noticeList"></div>
  <a class="home" href="index.html">🏠 홈으로 돌아가기</a>
</main>
<script>
function toggleNotice(item) {
  const detail = item.querySelector('.detail');
  detail.style.display =
    detail.style.display === 'block' ? 'none' : 'block';
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
async function loadNotices() {
  const noticeList = document.getElementById("noticeList");
  noticeList.textContent = "공지사항을 불러오는 중입니다.";

  const client = supabase.createClient(
    "https://ocdcolatdqdhbtlaczqu.supabase.co",
    "sb_publishable_lAayL_opCjkcmH9NA06fzw_EoCITwdm"
  );

  const { data, error } = await client
    .from("notices")
    .select("title, content, created_at")
    .order("created_at", { ascending: false });

  if (error) {
    noticeList.textContent = "공지사항을 불러오지 못했습니다.";
    console.error(error);
    return;
  }

  noticeList.replaceChildren();

  if (!data || data.length === 0) {
    noticeList.textContent = "등록된 공지사항이 없습니다.";
    return;
  }

  data.forEach(item => {
    const card = document.createElement("div");
    card.className = "notice";

    const title = document.createElement("h3");
    title.textContent = item.title;

    const content = document.createElement("div");
    content.className = "detail";
    content.style.display = "none";
    content.textContent = item.content;
    content.style.whiteSpace = "pre-wrap";

    
card.addEventListener("click", () => {
  toggleNotice(card);
});

card.append(title, content);

    noticeList.appendChild(card);
  });
}

loadNotices();
</script>

</body>
</html>
