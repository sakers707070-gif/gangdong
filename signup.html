
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>박춘선 웹앱 회원가입</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f7fa;
      color: #172033;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 35px 20px;
      text-align: center;
    }
    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 22px;
    }
    h1 { font-size: 25px; }
    .card {
      background: white;
      border-radius: 18px;
      padding: 25px 20px;
      margin-top: 25px;
      box-shadow: 0 3px 12px #00000012;
    }
    .btn {
      display: block;
      padding: 17px;
      margin-top: 15px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      background: #e94b8b;
      color: white;
    }
    .admin { background: #334155; }
    .home { background: #e5e7eb; color: #222; }
  </style>
</head>
<body>
  <main class="container">
    <img class="logo" src="박춘선.png" alt="박춘선 웹앱 아이콘">
    <h1>강동엄마 박춘선 시의원</h1>
    <p>주민과 함께하는 소통 공간</p>

    <div class="card">
      <h2>회원가입 및 로그인</h2>
      <p>원하시는 메뉴를 선택해 주세요.</p>

     <div id="residentSignup">
  <h3>주민 회원가입</h3>
  <label for="residentName">이름</label>
  <input id="residentName" type="text" placeholder="이름을 입력하세요" autocomplete="name" style="width:100%;padding:12px;box-sizing:border-box;margin:8px 0 14px;">
  <label for="residentPhone">휴대전화번호</label>
  <input id="residentPhone" type="tel" placeholder="010-0000-0000" autocomplete="tel" style="width:100%;padding:12px;box-sizing:border-box;margin:8px 0 14px;">
  
<label for="residentEmail">이메일</label>
<input id="residentEmail" type="email"
  placeholder="네이버·다음·구글 이메일 입력"
  autocomplete="email"
  style="width:100%;padding:12px;box-sizing:border-box;margin:8px 0 14px;">

       <label for="residentPassword">비밀번호</label>
  <input id="residentPassword" type="password" placeholder="비밀번호를 입력하세요" autocomplete="new-password" style="width:100%;padding:12px;box-sizing:border-box;margin:8px 0 14px;">
  <label style="display:block;text-align:left;margin:12px 0;">
    <input id="residentPrivacyAgree" type="checkbox">
    개인정보 수집·이용 동의 (필수)
  </label>
  <p style="font-size:13px;text-align:left;color:#555;">수집 항목: 이름, 휴대전화번호<br>이용 목적: 회원 식별, 제보 내역 및 인센티브 관리<br>보유 기간 및 삭제 방법은 운영정책 확정 후 안내합니다.</p>
 <button type="button" class="btn" style="width:100%;border:0;cursor:pointer;" onclick="registerResident()">회원가입</button>
</div>
      <a class="btn admin" href="admin.html">
        관리자 로그인
      </a>

      <a class="btn home" href="index.html">
        홈으로 돌아가기
      </a>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://ocdcolatdqdhbtlaczqu.supabase.co";
const SUPABASE_KEY = "sb_publishable_lAayL_opCjkcmH9NA06fzw_EoCITwdm";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
 async function registerResident() {
  const name = document.getElementById("residentName").value.trim();
  const phone = document.getElementById("residentPhone").value.trim();
  const email = document.getElementById("residentEmail").value.trim();
  const password = document.getElementById("residentPassword").value;
  const agreed = document.getElementById("residentPrivacyAgree").checked;

  if (!name || !phone || !email || !password) {
    alert("모든 항목을 입력해주세요.");
    return;
  }

  if (!agreed) {
    alert("개인정보 수집·이용에 동의해주세요.");
    return;
  }

  if (password.length < 8) {
    alert("비밀번호는 8자 이상 입력해주세요.");
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
  emailRedirectTo: "https://sakers707070-gif.github.io/gangdong/",
  data: { name, phone }
}
    }
  });

  if (error) {
    alert("회원가입 오류: " + error.message);
    return;
  }

  alert("회원가입 신청이 완료되었습니다. 이메일 인증 안내를 확인해주세요.");
} 
</script>

</body>
</html>
