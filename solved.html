<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이렇게 해결했어요 | 강동웹앱</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f8fa;
      color: #222;
      font-family: "Malgun Gothic", sans-serif;
    }
    main {
      max-width: 760px;
      margin: auto;
      padding: 24px 18px 60px;
    }
    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #333;
      text-decoration: none;
      font-weight: bold;
    }
    h1 { font-size: 26px; margin-bottom: 10px; }
    .intro { color: #666; margin-bottom: 28px; }
    details {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    summary {
      padding: 20px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    .detail {
      padding: 0 20px 20px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .location {
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .status {
      color: #666;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← 홈으로</a>
    <h1>이렇게 해결했어요</h1>
    <p class="intro">주민 여러분의 제보로 달라진 강동구의 모습을 확인하세요.</p>
    <div id="solvedList" class="status">해결 사례를 불러오는 중입니다...</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://ocdcolatdqdhbtlaczqu.supabase.co";

    // 기존 index.html에 있는 공개용 키를 입력합니다.
    const SUPABASE_KEY = "sb_publishable_lAayL_opCjkcmH9NA06fzw_EoCITwdm";

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function loadSolvedReports() {
      const list = document.getElementById("solvedList");

      const { data, error } = await client
        .from("resolved_news")
        .select("title, location, resolution_content");

      if (error) {
        list.textContent = "해결 사례를 불러오지 못했습니다.";
        console.error(error);
        return;
      }

      list.replaceChildren();
      list.classList.remove("status");

      if (!data || data.length === 0) {
        list.textContent = "등록된 해결 사례가 없습니다.";
        return;
      }

      data.forEach(report => {
        const item = document.createElement("details");
        const heading = document.createElement("summary");
        heading.textContent = report.title || "해결 사례";

        const detail = document.createElement("div");
        detail.className = "detail";

        if (report.location) {
          const location = document.createElement("div");
          location.className = "location";
          location.textContent = report.location;
          detail.appendChild(location);
        }

        const content = document.createElement("div");
        content.textContent =
          report.resolution_content || "등록된 해결 내용이 없습니다.";

        detail.appendChild(content);
        item.append(heading, detail);
        list.appendChild(item);
      });
    }

    loadSolvedReports();
  </script>
</body>
</html>
