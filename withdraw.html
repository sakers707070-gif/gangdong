<a class="btn" href="#" onclick="if(confirm('정말 회원탈퇴를 진행하시겠습니까?')) { alert('아직 실제 탈퇴 기능은 연결되지 않았습니다.'); } return false;" style="background:#c62828;">회원탈퇴</a>
